name: Build & Release

on:
  push:
    branches: [main]

# Serial execution: if a second push arrives while a release is in progress, it
# waits instead of cancelling. This prevents two jobs bumping from the same base
# version and colliding on the git tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Lint & test — fast gate before the expensive build
  validate:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Get Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  # 2. Bump build number, build artifacts, commit bump, publish release
  build-and-release:
    name: Build & Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout the tip of main (not the triggering SHA) so that if a previous
      # release job already bumped pubspec.yaml, this job reads the new value.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump build number
        id: bump
        run: |
          CURRENT=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          VERSION_NAME=$(echo "$CURRENT" | cut -d'+' -f1)
          BUILD_NUM=$(echo "$CURRENT" | cut -d'+' -f2)
          NEW_BUILD=$((BUILD_NUM + 1))
          NEW_VERSION="${VERSION_NAME}+${NEW_BUILD}"
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Bumped: ${CURRENT} → ${NEW_VERSION}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"         >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"               >> android/key.properties
          echo "storeFile=upload-keystore.jks"                   >> android/key.properties

      - name: Build APK
        run: flutter build apk --release --dart-define=APP_SECRET=${{ secrets.APP_SECRET }}

      # - name: Build App Bundle
      #   run: flutter build appbundle --release --dart-define=APP_SECRET=${{ secrets.APP_SECRET }}

      # Create the release first so the tag points at your feature commit (current
      # HEAD), not at the bot's version-bump commit that follows.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Commit the bumped pubspec.yaml back to main. [skip ci] prevents this
      # commit from re-triggering the workflow.
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump build number to ${{ steps.bump.outputs.version }} [skip ci]"
          git push
