name: Build & Release

on:
  push:
    branches: [dev]

# Serial execution: if a second push arrives while a release is in progress, it
# waits instead of cancelling, so every pushed version gets its own release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Lint & test — fast gate before the expensive build
  validate:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Get Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  # 2. Build artifacts and publish a release for the version in pubspec.yaml
  build-and-release:
    name: Build & Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The build number in pubspec.yaml is bumped locally by the .husky/pre-push
      # hook (once per push to dev), so just read the version that's already there.
      - name: Read version
        id: version
        run: |
          CURRENT=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "tag=v${CURRENT}" >> $GITHUB_OUTPUT
          echo "Releasing: ${CURRENT}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"         >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"               >> android/key.properties
          echo "storeFile=upload-keystore.jks"                   >> android/key.properties

      - name: Build APK
        run: flutter build apk --release --dart-define=APP_SECRET=${{ secrets.APP_SECRET }}

      # - name: Build App Bundle
      #   run: flutter build appbundle --release --dart-define=APP_SECRET=${{ secrets.APP_SECRET }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
