name: Build & Release

on:
  push:
    branches: [main]

# Serial execution: if a second push arrives while a release is in progress, it
# waits instead of cancelling, so every pushed version gets its own release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Lint & test — fast gate before the expensive build
  validate:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Get Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  # 2. Gate: only release when the version in pubspec.yaml hasn't been released
  #    yet. The .husky/pre-push hook bumps the build number locally, but that
  #    hook can't run on the Codeberg->GitHub mirror, web edits, or pushes made
  #    with --no-verify. So the authoritative "did the version increment?" check
  #    lives here: if a release for this tag already exists, there's nothing new
  #    to publish and we skip the expensive build.
  gate:
    name: Check version
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already released
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          TAG="v${CURRENT}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — version not incremented, skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $CURRENT is new — will build and release $TAG."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # 3. Build artifacts and publish a release for the version in pubspec.yaml
  build-and-release:
    name: Build & Release
    needs: [validate, gate]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"         >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"               >> android/key.properties
          echo "storeFile=upload-keystore.jks"                   >> android/key.properties

      - name: Build APK
        run: flutter build apk --release --dart-define=APP_SECRET=${{ secrets.APP_SECRET }}

      # - name: Build App Bundle
      #   run: flutter build appbundle --release --dart-define=APP_SECRET=${{ secrets.APP_SECRET }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
