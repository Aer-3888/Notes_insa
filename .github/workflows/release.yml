name: Release APK

on:
  push:
    branches: [main]
    paths:
      - pubspec.yaml

# Only write permission needed — for creating the GitHub release/tag
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version bump
        id: version
        run: |
          OLD=$(git show HEAD~1:pubspec.yaml | grep '^version:' | awk '{print $2}' | cut -d'+' -f1)
          NEW=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "Old version: $OLD"
          echo "New version: $NEW"
          if [ -z "$NEW" ]; then
            echo "ERROR: Could not extract version from pubspec.yaml"
            exit 1
          fi
          if [ "$OLD" = "$NEW" ]; then
            echo "No version bump detected, skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version bumped from $OLD to $NEW"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.version.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        if: steps.version.outputs.skip == 'false'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        if: steps.version.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Write local.properties
        if: steps.version.outputs.skip == 'false'
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Verify AAR dependency
        if: steps.version.outputs.skip == 'false'
        run: |
          test -f android/app/lib/inscore.aar || (echo "ERROR: inscore.aar not found" && exit 1)

      - name: Decode keystore
        if: steps.version.outputs.skip == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
          chmod 600 /tmp/release.keystore

      - name: Flutter pub get
        if: steps.version.outputs.skip == 'false'
        run: flutter pub get

      - name: Build release APK
        if: steps.version.outputs.skip == 'false'
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Rename APK
        if: steps.version.outputs.skip == 'false'
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            notes_insa-${{ steps.version.outputs.version }}.apk

      - name: Upload APK artifact
        if: steps.version.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.version.outputs.version }}
          path: notes_insa-*.apk
          retention-days: 7

      - name: Create release draft
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          files: notes_insa-*.apk

      - name: Cleanup keystore
        if: always()
        run: rm -f /tmp/release.keystore
