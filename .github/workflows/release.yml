name: Build & Release

on:
  push:
    tags:
      - 'v*'

# Releases are cut by pushing a tag to Codeberg, which the mirror carries here.
# A tag this workflow creates on GitHub does not survive the next mirror sync:
# GitHub then demotes the release to an untagged draft that nobody can download.
# Serial execution so two tags in quick succession both get their own release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Lint and test, a fast gate before the expensive build
  validate:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned: 'stable' floats, so a Flutter that drops an API reddens CI on its own.
          flutter-version: 3.41.9
          cache: true
      - name: Get Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  # 2. Build the APK and publish it against the tag that triggered this run
  build-and-release:
    name: Build & Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned: 'stable' floats, so a Flutter that drops an API reddens CI on its own.
          flutter-version: 3.41.9
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"         >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"               >> android/key.properties
          echo "storeFile=upload-keystore.jks"                   >> android/key.properties

      - name: Read the version for the release title
        id: version
        run: |
          CURRENT=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          echo "name=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: flutter build apk --release --dart-define=APP_SECRET=${{ secrets.APP_SECRET }}

      # - name: Build App Bundle
      #   run: flutter build appbundle --release --dart-define=APP_SECRET=${{ secrets.APP_SECRET }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.name }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
