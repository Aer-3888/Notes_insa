name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'

jobs:
  deploy:
    name: Deploy worker
    runs-on: ubuntu-latest
    # Avoid overlapping deployments for the same branch
    concurrency:
      group: deploy-worker-${{ github.ref }}
      cancel-in-progress: true
    # Limit permissions to only what's needed for the workflow
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history can be useful for reproducible builds; set to 0 to speed up if not needed
          fetch-depth: 0

      - name: Setup Node.js (with cache)
        uses: actions/setup-node@v4
        with:
          # Use the current LTS release (tracks official LTS like Node 20, Node 24 when it becomes LTS)
          # This gives you newer LTS updates while avoiding bleeding-edge breaking changes.
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Create wrangler.toml from template
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_ID: ${{ secrets.D1_ID }}
          KV_ID: ${{ secrets.KV_ID }}
          ADE_KV_ID: ${{ secrets.ADE_KV_ID }}
          LAUNDRY_KV_ID: ${{ secrets.LAUNDRY_KV_ID }}
          ASSOCIATIONS_KV_ID: ${{ secrets.ASSOCIATIONS_KV_ID }}
        working-directory: worker
        run: |
          set -euo pipefail
          cp wrangler.toml.template wrangler.toml
          sed -i "s|__ACCOUNT_ID__|${CF_ACCOUNT_ID:-}|g" wrangler.toml
          sed -i "s|__D1_ID__|${D1_ID:-}|g" wrangler.toml
          sed -i "s|__RATE_LIMIT_KV_ID__|${KV_ID:-}|g" wrangler.toml
          sed -i "s|__ADE_KV_ID__|${ADE_KV_ID:-}|g" wrangler.toml
          sed -i "s|__LAUNDRY_KV_ID__|${LAUNDRY_KV_ID:-}|g" wrangler.toml
          sed -i "s|__ASSOCIATIONS_KV_ID__|${ASSOCIATIONS_KV_ID:-}|g" wrangler.toml
          # A placeholder that survives means a missing secret. Failing here
          # names it, instead of letting wrangler fail on a nonsense id later.
          if grep -n "__[A-Z0-9_]*__" wrangler.toml; then
            echo "ERROR: the placeholders above were not substituted. Set the matching repository secret."
            exit 1
          fi

      - name: Verify Wrangler & Token
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # Fail fast if the required token is not set
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN secret is not set. Aborting deployment."
            exit 1
          fi
          npx wrangler --version
          # Verify token works (whoami prints account details), won't print the token itself
          npx wrangler whoami

      - name: Deploy with Wrangler
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # Deploy to workers.dev (this repository is configured for Cloudflare Workers only, no custom domain)
          npx wrangler deploy
