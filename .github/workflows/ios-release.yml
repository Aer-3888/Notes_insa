name: iOS TestFlight

on:
  workflow_dispatch:
  # Enable after the first successful TestFlight upload.
  # push:
  #   tags:
  #     - 'v*'

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-ios:
    name: Build and upload to TestFlight
    # App Store Connect requires the iOS 26 SDK, supplied by Xcode 26.
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          if [ -f Podfile.lock ]; then
            pod install --deployment
          else
            pod install
          fi

      - name: Build signed IPA and upload to TestFlight
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          for name in APP_SECRET ASC_ISSUER_ID ASC_KEY_ID ASC_KEY_P8_BASE64 CERT_B64 CERT_PASSWORD KEYCHAIN_PASSWORD PROFILE_B64; do
            if [ -z "${!name}" ]; then
              echo "Required TestFlight configuration is missing: $name" >&2
              exit 1
            fi
          done

          keychain_path="$RUNNER_TEMP/campus-hub-build.keychain-db"
          certificate_path="$RUNNER_TEMP/distribution.p12"
          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"
          export_options_path="$RUNNER_TEMP/ExportOptions.plist"
          api_key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          installed_profile_path=""
          appstore_key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          cleanup() {
            security default-keychain -s login.keychain-db || true
            security delete-keychain "$keychain_path" || true
            rm -f "$certificate_path" "$profile_path" "$profile_plist" "$export_options_path" "$api_key_path" "$installed_profile_path" "$appstore_key_path"
          }
          trap cleanup EXIT

          printf '%s' "$CERT_B64" | base64 -D > "$certificate_path"
          printf '%s' "$PROFILE_B64" | base64 -D > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"

          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")
          team_id=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")
          profile_app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")
          case "$profile_app_id" in
            *.com.aer.campus) ;;
            *)
            echo "The provisioning profile does not belong to com.aer.campus" >&2
            exit 1
              ;;
          esac

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security import "$certificate_path" -k "$keychain_path" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          installed_profile_path="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          cp "$profile_path" "$installed_profile_path"

          cat >> ios/Flutter/Release.xcconfig <<EOF
          DEVELOPMENT_TEAM=$team_id
          CODE_SIGN_STYLE=Manual
          PROVISIONING_PROFILE_SPECIFIER=$profile_name
          EOF

          cat > "$export_options_path" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$team_id</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.aer.campus</key>
              <string>$profile_uuid</string>
            </dict>
          </dict>
          </plist>
          EOF

          flutter build ipa --release \
            --dart-define=APP_SECRET="$APP_SECRET" \
            --export-options-plist="$export_options_path"

          ipa_path=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa_path"

          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -D > "$api_key_path"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$api_key_path" "$appstore_key_path"
          xcrun altool --upload-app --type ios -f "$ipa_path" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
