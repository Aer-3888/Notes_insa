org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Disable gradle caching to fix cache corruption issues
org.gradle.caching=false

# Disable incremental builds that cause issues
org.gradle.parallel=false
org.gradle.configureondemand=false

# CMake related fixes
android.enableCMakeNdkCompileParallel=false
android.enableCMakeBuildCoalescing=false

# Android build optimizations
android.enableJetifier=true

# Force clean builds
org.gradle.vfs.watch=false
org.gradle.unsafe.configuration-cache=false

# Disable file system watching that can cause locks
org.gradle.vfs.verbose=false

